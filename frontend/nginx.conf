server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las rutas del backend no tienen prefijo (/health, /predict...): /api/ lo quitamos al reenviar.
    # "backend" es el nombre del servicio en docker-compose.yml (DNS interno de Docker).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # El front corta a los 60 s (api.js); nginx espera un poco más para que el error lo dé el front, no nginx.
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri /index.html;
    }
}
