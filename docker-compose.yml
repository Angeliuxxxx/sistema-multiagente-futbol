# Arranque: docker compose up --build   ->  UI http://localhost:8080 · API http://localhost:8000/docs
# Ollama NO va en el contenedor: se usa el del anfitrión (GPU, modelos ya descargados). Ver docs/despliegue.md.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # En Docker Desktop host.docker.internal existe solo; extra_hosts lo añade también en Docker Engine nativo.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      # El registro versionado de pronósticos se hace desde el anfitrión (cd backend && python -m scripts.registro_predicciones registrar), no desde un
      # contenedor cuya copia de /data se pierde al apagarlo. Para activarlo aquí: REGISTRAR_AL_ARRANCAR=1 en .env (se perdería al apagar).
      REGISTRAR_AL_ARRANCAR: ${REGISTRAR_AL_ARRANCAR:-0}
      # Token de football-data.org: se lee del .env del anfitrión al ejecutar compose; nunca se hornea en la imagen.
      # Vacío = /proximos degrada a la caché (calendario_cache.json) sin romper la API.
      FOOTBALL_DATA_KEY: ${FOOTBALL_DATA_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Datos fuera de la imagen (los CSV/índices no están en Git y pesan). Solo lectura: no se modifica nada.
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
